# Base temporal exclusiva de las pruebas. La aplicación normal utiliza MySQL.
spring.datasource.url=${NEXO_TEST_DB_URL:jdbc:h2:mem:nexo_test;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${NEXO_TEST_DB_USER:sa}
spring.datasource.password=${NEXO_TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${NEXO_TEST_DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${NEXO_TEST_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${NEXO_TEST_DB_DDL:create-drop}
spring.sql.init.mode=never
nexo.admin.correo=bootstrap@nexo.test
nexo.admin.password=SoloParaPruebas123!
