spring.application.name=nexo
server.port=8080

# Crear primero la base de datos con creaTablas.sql, como en los ejemplos de clase.
spring.datasource.url=${NEXO_DB_URL:jdbc:mysql://localhost:3306/nexo}
spring.datasource.username=${NEXO_DB_USER:nexo}
spring.datasource.password=${NEXO_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.messages.encoding=UTF-8
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.tracking-modes=cookie
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
nexo.admin.correo=${NEXO_ADMIN_EMAIL:}
nexo.admin.password=${NEXO_ADMIN_PASSWORD:}
